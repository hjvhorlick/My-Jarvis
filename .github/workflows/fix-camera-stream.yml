name: Repair live camera stream

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-camera-stream:
    if: "${{ !contains(github.event.head_commit.message, 'Repair live camera stream') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch live camera loop
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("ui.py")
          text = path.read_text(encoding="utf-8")

          old = '''    def _cam_loop(self) -> None:
        try:
            import cv2
            # Reuse camera index detected by screen_processor (cached in api_keys.json)
            cam_idx = 0
            try:
                import json as _j
                cfg = _j.loads((CONFIG_DIR / "api_keys.json").read_text())
                cam_idx = int(cfg.get("camera_index", 0))
            except Exception:
                pass
            try:
                backend = cv2.CAP_DSHOW if _OS == "Windows" else cv2.CAP_ANY
            except AttributeError:
                backend = 0
            cap = cv2.VideoCapture(cam_idx, backend)
            if not cap.isOpened():
                cap = cv2.VideoCapture(0)
            if not cap.isOpened():
                return
            # warm-up frames
            for _ in range(5):
                cap.read()
            while not self._cam_stop.wait(0.033) and cap.isOpened():
                ret, frame = cap.read()
                if ret and frame is not None:
                    _, buf = cv2.imencode(".jpg", frame, [cv2.IMWRITE_JPEG_QUALITY, 65])
                    self._cam_frame_sig.emit(buf.tobytes())
            cap.release()
        except Exception as e:
            print(f"[Camera] Stream error: {e}")
        finally:
            self._cam_stream_sig.emit(False)
'''

          new = '''    def _cam_loop(self) -> None:
        """Keep the live feed alive until the user explicitly closes it.

        OpenCV can temporarily report a failed read or lose the V4L2 capture
        handle on Linux. The old loop used cap.isOpened() as its lifetime
        condition, so one transient backend failure silently ended the stream.
        This loop treats capture loss as recoverable and reopens the camera
        until stop_camera_stream() explicitly sets _cam_stop.
        """
        try:
            import cv2

            cam_idx = 0
            try:
                import json as _j
                cfg = _j.loads((CONFIG_DIR / "api_keys.json").read_text())
                cam_idx = int(cfg.get("camera_index", 0))
            except Exception:
                pass

            try:
                backend = cv2.CAP_DSHOW if _OS == "Windows" else cv2.CAP_ANY
            except AttributeError:
                backend = 0

            while not self._cam_stop.is_set():
                cap = None
                try:
                    cap = cv2.VideoCapture(cam_idx, backend)
                    if not cap.isOpened() and cam_idx != 0:
                        cap.release()
                        cap = cv2.VideoCapture(0, backend)
                    if not cap.isOpened():
                        if self._cam_stop.wait(0.5):
                            break
                        continue

                    try:
                        cap.set(cv2.CAP_PROP_BUFFERSIZE, 1)
                    except Exception:
                        pass

                    for _ in range(5):
                        if self._cam_stop.is_set():
                            break
                        cap.read()

                    failed_reads = 0
                    while not self._cam_stop.is_set():
                        ret, frame = cap.read()
                        if ret and frame is not None:
                            failed_reads = 0
                            ok, buf = cv2.imencode(
                                ".jpg", frame,
                                [cv2.IMWRITE_JPEG_QUALITY, 60],
                            )
                            if ok:
                                self._cam_frame_sig.emit(buf.tobytes())
                            if self._cam_stop.wait(0.10):
                                break
                        else:
                            failed_reads += 1
                            if failed_reads >= 10:
                                break
                            if self._cam_stop.wait(0.05):
                                break
                except Exception as e:
                    print(f"[Camera] Capture recovery: {e}")
                    if self._cam_stop.wait(0.5):
                        break
                finally:
                    if cap is not None:
                        try:
                            cap.release()
                        except Exception:
                            pass
        except Exception as e:
            print(f"[Camera] Stream error: {e}")
        finally:
            self._cam_stream_sig.emit(False)
'''

          if old not in text:
              raise SystemExit("Expected camera loop was not found; refusing to modify ui.py")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          subprocess.run(["python", "-m", "py_compile", "ui.py"], check=True)

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.py
          git diff --cached --quiet && exit 0
          git commit -m "Repair live camera stream"
          git push